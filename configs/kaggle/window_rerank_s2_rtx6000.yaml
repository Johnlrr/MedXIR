# Qwen3-Reranker-8B scores the 180 candidate windows per query of the 0.2984 recipe (fuse_scores.py --export-windows,
# dataset boinhbo/medxir-windows-rr8-v2), queries 2, 2+4, ... (shard 2 of 4, account boinhbo). fuse_scores.py --window-scores
# re-picks 131 of them.
kernel:
  id: boinhbo/medxir-window-rerank-s2
  title: medxir window rerank s2
  code_file: src/notebooks/kaggle_window_rerank_s2.ipynb
  kernel_type: notebook
  enable_gpu: true
  enable_internet: false
  machine_shape: NvidiaRtxPro6000
  expected_hardware_contains: "6000"
  competition_sources: [arc-prize-2026-arc-agi-3]
  kernel_sources: [boinhbo/medxir-package-qwenrr8b]
  dataset_sources: [boinhbo/medxir-windows-rr8-v2]
  timeout_seconds: 36000
  poll_interval_seconds: 300
  fetch_files: [progress.txt, faulthandler.txt, window_scores.parquet]
  required_outputs: [window_scores.parquet]
